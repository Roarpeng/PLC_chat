[project]
name = "plc-intelligence"
version = "0.1.0"
description = "Standalone Industrial PLC Intelligence & TIA Openness Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "rich>=13.9.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "httpx>=0.27.0",
]
storage = [
  "neo4j>=5.26.0",
  "qdrant-client>=1.12.0",
]

[project.scripts]
plc-cli = "agents.plc.tia_cli:main"
plc-gateway = "gateway.app.main:run"
plc-openness-worker = "industrial.openness_worker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "agents",
  "tools",
  "gateway",
  "industrial",
  "knowledge",
  "runtime",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
